<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking</title>
</head>
<body>

    <h1>IPL Ticket Booking Form</h1>

    <p>Book your tickets and experience the excitement of IPL live!</p>

    <form>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required minlength="3" maxlength="30">

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required minlength="10" maxlength="10" pattern="[0-9]{10}">

        <br><br>

        <label for="match">Select Match:</label>
        <select id="match" name="match" required>
            <option value="">-- Select Match --</option>
            <option value="SRH vs CSK">SRH vs CSK</option>
            <option value="SRH vs MI">SRH vs MI</option>
            <option value="SRH vs RCB">SRH vs RCB</option>
            <option value="SRH vs KKR">SRH vs KKR</option>
        </select>

        <br><br>

        <label for="stand">Stand Category:</label>
        <select id="stand" name="stand" required>
            <option value="">-- Select Stand --</option>
            <option value="General">General</option>
            <option value="Premium">Premium</option>
            <option value="VIP">VIP</option>
        </select>

        <br><br>

        <label for="tickets">Number of Tickets:</label>
        <input type="number" id="tickets" name="tickets" required min="1" max="10">

        <br><br>

        <p>Additional Preferences:</p>

        <input type="radio" id="family" name="preference" value="Family Seating">
        <label for="family">Family Seating</label>

        <input type="radio" id="regular" name="preference" value="Regular Seating">
        <label for="regular">Regular Seating</label>

        <br><br>

        <button type="submit">Submit Booking</button>
        <button type="reset">Reset Form</button>

    </form>

</body>
</html>
